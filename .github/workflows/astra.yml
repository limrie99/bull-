name: Astra paper trader

on:
  workflow_dispatch:
    inputs:
      routine:
        description: Routine to run
        required: true
        type: choice
        options:
          - premarket-research
          - opening-plan
          - entry-check
          - portfolio-check
          - closing-decision
          - risk-shutdown
  schedule:
    # Both EDT and EST candidates. runner.py validates New York local time.
    - cron: "0 12,13 * * 1-5"
    - cron: "25 13,14 * * 1-5"
    - cron: "15 14,15 * * 1-5"
    - cron: "30 16,17 * * 1-5"
    - cron: "0 19,20 * * 1-5"
    - cron: "50 19,20 * * 1-5"

permissions:
  contents: write

concurrency:
  group: astra-paper-trader
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # The committee polls up to six voices plus the chair, each with web search.
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ASTRA_ALPACA_API_KEY: ${{ secrets.ASTRA_ALPACA_API_KEY }}
      ASTRA_ALPACA_SECRET_KEY: ${{ secrets.ASTRA_ALPACA_SECRET_KEY }}
      ASTRA_EXECUTION_ENABLED: ${{ secrets.ASTRA_EXECUTION_ENABLED }}
      ASTRA_ALPACA_BASE_URL: https://paper-api.alpaca.markets
      ASTRA_MODEL: gpt-6-astra
      # Both optional: blank falls back to ASTRA_MODEL and to voices.json.
      ASTRA_VOICE_MODEL: ${{ vars.ASTRA_VOICE_MODEL }}
      ASTRA_VOICES_ENABLED: ${{ vars.ASTRA_VOICES_ENABLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Astra
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python astra/runner.py --routine "${{ inputs.routine }}"
          else
            python astra/runner.py --scheduled
          fi

      - name: Persist Astra memory
        shell: bash
        run: |
          if git diff --quiet -- astra/memory astra/dashboard; then
            echo "No Astra state change to persist."
            exit 0
          fi
          git config user.name "Astra"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add astra/memory astra/dashboard
          git commit -m "astra: persist scheduled decision"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
